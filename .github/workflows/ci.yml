name: CI

on:
  push:
    branches: [ main, master ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Go Format Check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files found:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Verify Module Dependencies
        run: go mod verify

  goreleaser-check:
    name: Validate Release Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run GoReleaser Check
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: check

  test-matrix:
    name: Unit & Integration Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests with Coverage (Linux with -race)
        if: runner.os == 'Linux'
        run: go test -v -race "-coverprofile=coverage.txt" -covermode=atomic ./...

      - name: Run Tests with Coverage (macOS with -race and external linking)
        if: runner.os == 'macOS'
        run: go test -v -race -ldflags="-linkmode=external" "-coverprofile=coverage.txt" -covermode=atomic ./...

      - name: Run Tests with Coverage (Windows pure Go)
        if: runner.os == 'Windows'
        run: go test -v "-coverprofile=coverage.txt" -covermode=atomic ./...

      - name: Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.txt

  cross-compile:
    name: Pure Go Zero-Cgo Compilation
    runs-on: ubuntu-latest
    needs: test-matrix
    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile for ${{ matrix.target.os }}/${{ matrix.target.arch }} with -trimpath
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/watchdog-${{ matrix.target.os }}-${{ matrix.target.arch }} .

  reproducibility-check:
    name: Deterministic Build Verification
    runs-on: ubuntu-latest
    needs: cross-compile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Reproducibility Verification
        run: |
          chmod +x scripts/verify-reproducibility.sh
          ./scripts/verify-reproducibility.sh
