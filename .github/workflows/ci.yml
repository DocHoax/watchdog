name: CI

on:
  push:
    branches: [ main, master ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
          cache: true

      - name: Go Format Check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files found:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

  test-matrix:
    name: Unit & Integration Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go: [ '1.27.1' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Run Tests with Coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.1'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.txt

  cross-compile:
    name: Pure Go Zero-Cgo Compilation
    runs-on: ubuntu-latest
    needs: test-matrix
    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Compile for ${{ matrix.target.os }}/${{ matrix.target.arch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/watchdog-${{ matrix.target.os }}-${{ matrix.target.arch }} .
