version: 2

project_name: watchdog

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: watchdog
    main: ./main.go
    binary: watchdog
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w
      - -X github.com/watchdog-cli/watchdog/cmd.Version={{ .Version }}
      - -X github.com/watchdog-cli/watchdog/cmd.GitCommit={{ .FullCommit }}
      - -X github.com/watchdog-cli/watchdog/cmd.BuildDate={{ .Date }}
      - -X github.com/watchdog-cli/watchdog/cmd.BuiltBy=goreleaser

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

nfpms:
  - id: watchdog-packages
    package_name: watchdog
    vendor: "Watchdog CLI"
    homepage: "https://github.com/watchdog-cli/watchdog"
    maintainer: "Watchdog Core Team <core@watchdog-cli.dev>"
    description: "Enterprise-Grade System Monitoring & Diagnostics CLI"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/local/bin
    section: utils
    contents:
      - src: ./docs/*
        dst: /usr/share/doc/watchdog/
