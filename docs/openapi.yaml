openapi: 3.0.3
info:
  title: Watchdog Fleet & Telemetry REST API
  description: Versioned REST API for local node observability, centralized fleet management, telemetry ingestion, and cluster health monitoring.
  version: 1.0.0
servers:
  - url: https://fleet.internal:8443
    description: Production Fleet Server
  - url: http://127.0.0.1:8443
    description: Local Agent Server

paths:
  /health:
    get:
      summary: Liveness Probe
      description: Returns liveness status of the Watchdog process.
      responses:
        '200':
          description: Process is alive and operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime_seconds:
                    type: number
                    example: 3600.5
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 1.0.0

  /ready:
    get:
      summary: Readiness Probe
      description: Returns readiness status of collectors and storage subsystems.
      responses:
        '200':
          description: Node is fully ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  collectors:
                    type: string
                    example: ok
                  storage:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Node is not ready (storage unavailable or collectors initializing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/node:
    get:
      summary: Get Node Identity
      description: Retrieves persistent cryptographic identity, hardware specs, and tags of the local machine.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Node identity details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeIdentity'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/telemetry:
    post:
      summary: Ingest Telemetry Snapshot
      description: Receives structured telemetry submission from an agent node.
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Watchdog-Node-ID
          schema:
            type: string
          description: Optional explicit node ID
        - in: header
          name: X-Watchdog-Agent-Version
          schema:
            type: string
          description: Agent version string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetrySubmission'
      responses:
        '200':
          description: Telemetry successfully ingested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /api/v1/heartbeat:
    post:
      summary: Submit Heartbeat
      description: Transmits periodic liveness signal to update last-seen timestamp and status.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Heartbeat acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/fleet/register:
    post:
      summary: Register Fleet Node
      description: Registers a new node in the centralized fleet registry.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRegistrationRequest'
      responses:
        '200':
          description: Node registration accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/fleet:
    get:
      summary: List Fleet Nodes
      description: Queries registered fleet nodes with filtering, pagination, and sorting.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [healthy, warning, critical, stale, offline, unknown]
          description: Filter nodes by status
        - in: query
          name: search
          schema:
            type: string
          description: Search by node ID, hostname, or IP address
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [hostname, last_heartbeat, cpu, memory, status]
        - in: query
          name: sort_direction
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: since
          schema:
            type: string
          description: Active since RFC3339 timestamp or duration (e.g. 10m, 2h)
      responses:
        '200':
          description: Filtered list of fleet nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/fleet/{node_id}:
    get:
      summary: Get Node Detail
      description: Retrieves comprehensive status, hardware specs, diagnostics, and recent telemetry for a single node.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: node_id
          required: true
          schema:
            type: string
          description: Unique node identifier
      responses:
        '200':
          description: Detailed node information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Deregister Node
      description: Removes a node from the fleet registry.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: node_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node successfully removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
                  node_id:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/fleet/summary:
    get:
      summary: Get Fleet Summary
      description: Aggregated health counts, node statuses, and cluster-wide resource utilization.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Fleet summary statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/intelligence/fleet:
    get:
      summary: Fleet Health & Intelligence Summary
      description: Evaluates overall fleet health score, degraded nodes, active incidents, and fleet findings.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Fleet health evaluation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetHealthSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/intelligence/nodes/{node_id}:
    get:
      summary: Node Health & Factor Breakdown
      description: Returns explainable health score, subsystem factor deductions, score trajectory, and active findings for a node.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: node_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed node health evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/intelligence/nodes/{node_id}/trends:
    get:
      summary: Node Metric Trends
      description: Closed-form linear regression rate-of-change and directional trajectory for key metrics.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: node_id
          required: true
          schema:
            type: string
        - in: query
          name: window
          schema:
            type: string
            default: "1h"
      responses:
        '200':
          description: Array of metric trends.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthTrend'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/intelligence/nodes/{node_id}/baselines:
    get:
      summary: Node Historical Baselines
      description: Statistical baseline benchmarks (Min, Max, Mean, StdDev, P50, P90, P95, P99).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: node_id
          required: true
          schema:
            type: string
        - in: query
          name: window
          schema:
            type: string
            default: "24h"
      responses:
        '200':
          description: Array of historical metric baselines.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricalBaseline'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/intelligence/incidents:
    get:
      summary: Active Fleet Incidents
      description: Lists active multi-signal and multi-node incidents clustered from alerts and diagnostic checks.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active incidents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/intelligence/incidents/{incident_id}:
    get:
      summary: Get Incident Details
      description: Returns full incident timeline and symptom breakdown.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: incident_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident details and chronological timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/intelligence/correlations:
    get:
      summary: Cross-Signal Temporal Correlations
      description: Computes temporal Pearson correlation coefficients between co-occurring signal pairs.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: window
          schema:
            type: string
            default: "1h"
      responses:
        '200':
          description: Array of signal correlations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Correlation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/intelligence/findings:
    get:
      summary: Intelligence Findings
      description: Queries structured findings across resource exhaustion, stability risks, and fleet patterns.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
      responses:
        '200':
          description: Array of intelligence findings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntelligenceFinding'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  responses:
    BadRequestError:
      description: Invalid request parameters or payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    UnauthorizedError:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    NotFoundError:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    RateLimitedError:
      description: Ingestion rate limit exceeded for node.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'

  schemas:
    APIErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: INVALID_TOKEN
            message:
              type: string
              example: Bearer authentication token is missing or invalid
            request_id:
              type: string
              example: c6a2b8e4-18c7-43cf-8ef3-d6c62c2f42a1
            timestamp:
              type: string
              format: date-time

    NodeIdentity:
      type: object
      required:
        - node_id
        - hostname
        - os
        - arch
      properties:
        node_id:
          type: string
          example: c56a4180-65aa-42ec-a945-5fd21dec0538
        hostname:
          type: string
          example: prod-worker-01.internal
        os:
          type: string
          example: linux
        platform:
          type: string
          example: ubuntu
        platform_version:
          type: string
          example: "22.04"
        kernel_version:
          type: string
          example: "5.15.0-101-generic"
        arch:
          type: string
          example: amd64
        cpu_cores:
          type: integer
          example: 16
        total_memory:
          type: integer
          format: int64
          example: 34359738368
        ip_addresses:
          type: array
          items:
            type: string
        mac_addresses:
          type: array
          items:
            type: string
        version:
          type: string
          example: 1.0.0
        tags:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time

    TelemetrySubmission:
      type: object
      required:
        - node_id
        - timestamp
      properties:
        node_id:
          type: string
        timestamp:
          type: string
          format: date-time
        snapshot:
          type: object
        diagnostic_status:
          type: string
          example: HEALTHY
        active_alerts_count:
          type: integer
          example: 0

    TelemetryResponse:
      type: object
      properties:
        accepted:
          type: boolean
          example: true
        points_count:
          type: integer
          example: 1
        buffered:
          type: boolean
          example: false
        timestamp:
          type: string
          format: date-time

    HeartbeatRequest:
      type: object
      required:
        - node_id
        - timestamp
        - status
      properties:
        node_id:
          type: string
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [healthy, warning, critical]
        cpu_usage_percent:
          type: number
        memory_usage_percent:
          type: number
        disk_usage_percent:
          type: number
        load1:
          type: number
        active_alerts_count:
          type: integer
        diagnostic_status:
          type: string

    HeartbeatResponse:
      type: object
      properties:
        acknowledged:
          type: boolean
          example: true
        node_status:
          type: string
          example: healthy
        next_heartbeat_interval:
          type: integer
          example: 15
        timestamp:
          type: string
          format: date-time

    NodeRegistrationRequest:
      type: object
      required:
        - identity
      properties:
        identity:
          $ref: '#/components/schemas/NodeIdentity'
        metadata:
          type: object
          additionalProperties:
            type: string

    NodeRegistrationResponse:
      type: object
      properties:
        registered:
          type: boolean
          example: true
        node_id:
          type: string
        registered_at:
          type: string
          format: date-time
        heartbeat_interval_seconds:
          type: integer
          example: 15
        telemetry_interval_seconds:
          type: integer
          example: 30
        message:
          type: string

    FleetSummary:
      type: object
      properties:
        total_nodes:
          type: integer
        healthy_nodes:
          type: integer
        warning_nodes:
          type: integer
        critical_nodes:
          type: integer
        stale_nodes:
          type: integer
        offline_nodes:
          type: integer
        unknown_nodes:
          type: integer
        avg_cpu_percent:
          type: number
        avg_memory_percent:
          type: number
        total_alerts:
          type: integer
        last_updated:
          type: string
          format: date-time

    FleetListResponse:
      type: object
      properties:
        total:
          type: integer
        count:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FleetNode'

    NodeDetailResponse:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/FleetNode'
        recent_telemetry:
          type: array
          items:
            $ref: '#/components/schemas/TelemetrySubmission'
        active_alerts:
          type: array
          items:
            type: object

    FleetNode:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/NodeIdentity'
        status:
          type: string
          enum: [healthy, warning, critical, stale, offline, unknown]
        status_message:
          type: string
        registered_at:
          type: string
          format: date-time
        last_heartbeat:
          type: string
          format: date-time
        last_telemetry:
          type: string
          format: date-time
        summary:
          type: object
        metadata:
          type: object
          additionalProperties:
            type: string

    FleetHealthSummary:
      type: object
      properties:
        evaluated_at:
          type: string
          format: date-time
        total_nodes:
          type: integer
        healthy_count:
          type: integer
        warning_count:
          type: integer
        critical_count:
          type: integer
        stale_count:
          type: integer
        offline_count:
          type: integer
        average_score:
          type: number
        lowest_scoring_nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeHealthSummary'
        fleet_trends:
          type: array
          items:
            $ref: '#/components/schemas/HealthTrend'
        active_incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        fleet_findings:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceFinding'

    NodeHealthSummary:
      type: object
      properties:
        node_id:
          type: string
        hostname:
          type: string
        status:
          type: string
        health_score:
          $ref: '#/components/schemas/HealthScore'
        trends:
          type: array
          items:
            $ref: '#/components/schemas/HealthTrend'
        baselines:
          type: array
          items:
            $ref: '#/components/schemas/HistoricalBaseline'
        active_incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceFinding'
        evaluated_at:
          type: string
          format: date-time

    HealthScore:
      type: object
      properties:
        score:
          type: number
          example: 92.5
        normalized_status:
          type: string
          enum: [healthy, warning, critical, stale, offline, unknown]
        trajectory:
          type: string
          enum: [improving, degrading, stable, volatile, unknown]
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/FactorContribution'
        primary_concerns:
          type: array
          items:
            type: string
        evaluated_at:
          type: string
          format: date-time

    FactorContribution:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        weight:
          type: number
        score:
          type: number
        deduction:
          type: number
        impact:
          type: string
          enum: [positive, negative, neutral]
        explanation:
          type: string

    HealthTrend:
      type: object
      properties:
        metric:
          type: string
        direction:
          type: string
          enum: [increasing, decreasing, stable, insufficient_data]
        rate_of_change:
          type: number
        unit:
          type: string
        start_value:
          type: number
        end_value:
          type: number
        window:
          type: integer
          description: Window duration in nanoseconds
        confidence:
          type: number

    HistoricalBaseline:
      type: object
      properties:
        metric:
          type: string
        window:
          type: integer
        sample_count:
          type: integer
        min:
          type: number
        max:
          type: number
        mean:
          type: number
        std_dev:
          type: number
        p50:
          type: number
        p90:
          type: number
        p95:
          type: number
        p99:
          type: number
        computed_at:
          type: string
          format: date-time

    Incident:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [open, mitigated, resolved]
        severity:
          type: string
          enum: [critical, warning, info]
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
        affected_nodes:
          type: array
          items:
            type: string
        primary_symptoms:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/IncidentTimelineEvent'

    IncidentTimelineEvent:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        node_id:
          type: string
        event_type:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]

    Correlation:
      type: object
      properties:
        primary_signal:
          type: string
        secondary_signal:
          type: string
        coefficient:
          type: number
        time_offset_seconds:
          type: integer
        co_occurrence_count:
          type: integer
        confidence:
          type: string
          enum: [high, medium, low]
        description:
          type: string

    IntelligenceFinding:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
          enum: [resource_exhaustion, performance_degradation, fleet_pattern, stability_risk, anomaly_cluster]
        severity:
          type: string
          enum: [info, warning, critical]
        confidence:
          type: string
          enum: [high, medium, low]
        title:
          type: string
        description:
          type: string
        affected_nodes:
          type: array
          items:
            type: string
        supporting_evidence:
          type: array
          items:
            type: string
        non_invasive_suggestions:
          type: array
          items:
            type: string
        detected_at:
          type: string
          format: date-time
