apiVersion: v1
kind: Namespace
metadata:
  name: watchdog-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchdog-agent
  namespace: watchdog-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: watchdog-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: watchdog-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: watchdog-agent
subjects:
  - kind: ServiceAccount
    name: watchdog-agent
    namespace: watchdog-system
---
# Secret for authentication token.
# Create with:
#   kubectl create secret generic watchdog-auth \
#     --namespace=watchdog-system \
#     --from-literal=token="$(openssl rand -base64 32)"
#
# Do NOT commit real secrets to version control.
apiVersion: v1
kind: Secret
metadata:
  name: watchdog-auth
  namespace: watchdog-system
type: Opaque
data: {}
# Populate the "token" key via kubectl create secret (see above) or a
# secrets management system (Vault, Sealed Secrets, External Secrets Operator).
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: watchdog
  namespace: watchdog-system
  labels:
    app.kubernetes.io/name: watchdog
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: watchdog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchdog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: watchdog-agent
      # hostNetwork is required so Watchdog can:
      #   1. Collect host-level network interface metrics (RX/TX bytes, errors,
      #      connection states) that are invisible from a pod's virtual network
      #      namespace.
      #   2. Bind its Prometheus /metrics endpoint to the node's IP, enabling
      #      direct node-port scraping without a Service or kube-proxy hop.
      # Without hostNetwork, network metrics would reflect only the pod's veth
      # pair rather than the physical/virtual NICs on the node.
      hostNetwork: true
      # hostPID is required to enumerate and monitor all host processes via
      # /proc for process tree mapping, zombie detection, and runaway process
      # identification.
      hostPID: true
      containers:
        - name: watchdog
          image: watchdog:latest
          imagePullPolicy: IfNotPresent
          args:
            - "serve"
            - "--prometheus"
            - "--port"
            - "9100"
            - "--token-file"
            - "/etc/watchdog/secrets/token"
          ports:
            - name: prometheus
              containerPort: 9100
              hostPort: 9100
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: var-run-docker
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: watchdog-storage
              mountPath: /home/watchdog/.watchdog
            - name: watchdog-auth-secret
              mountPath: /etc/watchdog/secrets
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: var-run-docker
          hostPath:
            path: /var/run/docker.sock
        - name: watchdog-storage
          emptyDir: {}
        - name: watchdog-auth-secret
          secret:
            secretName: watchdog-auth
            optional: true
