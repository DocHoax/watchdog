apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: watchdog
  namespace: watchdog-system
  labels:
    app.kubernetes.io/name: watchdog
    app.kubernetes.io/part-of: watchdog
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: watchdog
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
