apiVersion: v1
kind: Secret
metadata:
  name: watchdog-auth
  namespace: watchdog-system
  labels:
    app.kubernetes.io/name: watchdog
    app.kubernetes.io/part-of: watchdog
type: Opaque
# Populate the token key with a secure random bearer token.
# Example command:
#   kubectl create secret generic watchdog-auth \
#     --namespace=watchdog-system \
#     --from-literal=token="$(openssl rand -base64 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Do NOT commit real production tokens to version control.
stringData:
  token: "replace-with-secure-random-token"
